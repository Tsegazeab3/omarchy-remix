# ==============================================================================
# Tmux Configuration (Responsive to Omarchy)
# ==============================================================================

# --- Reload Configuration ---
bind -N "Reload configuration" r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded!"

# --- Omarchy Keybindings Menu ---
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# --- Prefix Settings ---
# Primary: C-b (Vim/User default) | Secondary: C-Space (Omarchy standard)
set -g prefix C-b
set -g prefix2 C-Space
bind -N "Send prefix" C-b send-prefix
bind -N "Send secondary prefix" C-Space send-prefix

# --- Terminal & System Integration ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -g extended-keys on
set -g extended-keys-format csi-u
set -s escape-time 0
set -g focus-events on
set -g mouse on
set -g allow-passthrough on
set -g set-clipboard on
set -g history-limit 1000000
set -g detach-on-destroy off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on

# --- Mouse Scrolling ---
bind -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e"
bind -T root WheelDownPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "send-keys -M"
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# --- Navigation & Splits ---

# Alt (M) keys for prefix-less movement
bind -N "Focus pane left" -n M-h select-pane -L
bind -N "Focus pane down" -n M-j select-pane -D
bind -N "Focus pane up" -n M-k select-pane -U
bind -N "Focus pane right" -n M-l select-pane -R

# Prefix navigation
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

# Arrow navigation (Omarchy defaults)
bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane down" -n C-M-Down select-pane -D
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane right" -n C-M-Right select-pane -R

# Windows & Panes
bind -N "Create window" t new-window -c "#{pane_current_path}"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Rename window" R command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Kill pane" q kill-pane
bind -N "Kill pane" x kill-pane
bind -N "Kill pane" -n M-Escape kill-pane

# Split windows (User v/s & Omarchy Alt-Enter/Alt-Shift-Enter)
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically" s split-window -v -c "#{pane_current_path}"
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch windows with Shift-Arrow and Alt-Arrow
bind -N "Previous window" -n S-Left previous-window
bind -N "Next window" -n S-Right next-window
bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Switch windows using numbers (1-9, 0)
bind -N "Switch to window 1" 1 select-window -t :1
bind -N "Switch to window 2" 2 select-window -t :2
bind -N "Switch to window 3" 3 select-window -t :3
bind -N "Switch to window 4" 4 select-window -t :4
bind -N "Switch to window 5" 5 select-window -t :5
bind -N "Switch to window 6" 6 select-window -t :6
bind -N "Switch to window 7" 7 select-window -t :7
bind -N "Switch to window 8" 8 select-window -t :8
bind -N "Switch to window 9" 9 select-window -t :9
bind -N "Switch to window 10" 0 select-window -t :10

# Switch windows using symbols (! @ # $ % ^ & * ( ))
unbind !
unbind '@'
unbind '#'
unbind '$'
unbind '%'
unbind '^'
unbind '&'
unbind '*'
unbind '('
unbind ')'
bind -N "Switch to window 1" ! select-window -t :1
bind -N "Switch to window 2" '@' select-window -t :2
bind -N "Switch to window 3" '#' select-window -t :3
bind -N "Switch to window 4" '$' select-window -t :4
bind -N "Switch to window 5" '%' select-window -t :5
bind -N "Switch to window 6" '^' select-window -t :6
bind -N "Switch to window 7" '&' select-window -t :7
bind -N "Switch to window 8" '*' select-window -t :8
bind -N "Switch to window 9" '(' select-window -t :9
bind -N "Switch to window 10" ')' select-window -t :10

# --- Resize Panes ---
bind -N "Resize pane left" -r H resize-pane -L 5
bind -N "Resize pane down" -r J resize-pane -D 5
bind -N "Resize pane up" -r K resize-pane -U 5
bind -N "Resize pane right" -r L resize-pane -R 5
bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# --- Session Controls ---
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# --- Copy Mode (Vim style) ---
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send-keys -X begin-selection
bind -N "Rectangle toggle" -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -N "Copy selection" -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Plugins (using TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# --- Dynamic Omarchy Theme ---
# Generated from ~/.config/omarchy/themed/tmux.conf.tpl upon theme change
source-file -q ~/.local/state/omarchy/current/theme/tmux.conf

# Fuzzy search sessions/windows/panes/processes (prefix + f)
bind -N "Fuzzy find pane" f display-popup -E -w 80% -h 70% -T "Find" "~/.config/tmux/fzf-switch.sh"
